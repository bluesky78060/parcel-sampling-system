name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 배포 전에 순수 함수 회귀 테스트를 통과해야 한다.
      # 실패하면 빌드로 넘어가지 않으므로 결함이 GitHub Pages까지 가지 않는다.
      # vitest 앞에 scripts/verify-export-format.mjs(내보내기 형식 검사)도 함께 돈다.
      - run: npm run test

      - run: npm run build
        env:
          VITE_VWORLD_KEY: ${{ secrets.VITE_VWORLD_KEY }}
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
          VITE_KAKAO_REST_KEY: ${{ secrets.VITE_KAKAO_REST_KEY }}

      - name: Copy index.html as 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
