name: Test

on:
  # main 푸시는 Deploy 워크플로가 같은 검사를 돌리므로 제외한다.
  # 같은 저장소 브랜치로 PR을 열면 push와 pull_request가 둘 다 걸리는데,
  # 아래 concurrency가 앞선 실행을 취소해 중복 비용을 없앤다.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run test`는 vitest 앞에 scripts/verify-export-format.mjs를 돌린다.
      # 내보내기가 전부 bookType: 'xlsx'인지 소스 수준에서 본다 —
      # 수식 주입을 이스케이프하지 않는다는 결정이 그 전제 위에 서 있다.
      - run: npm run test

      # 타입 검사를 겸한다 (build 스크립트가 `tsc -b && vite build`).
      # API 키가 없어도 빌드는 통과한다 — 키는 런타임에만 쓰인다.
      - run: npm run build
